name: Keep Supabase Alive

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: TEST - Insertar fila de keep-alive (sin delay, sin dado)
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/postulaciones" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{
              "nombre": "__keepalive__",
              "cedula": "0",
              "correo": "keepalive@internal.local",
              "comentario": "TEST - Fila automatica de keep-alive. Puede borrarse manualmente."
            }' \
            --fail --silent --show-error
          echo "✅ Fila TEST insertada"
